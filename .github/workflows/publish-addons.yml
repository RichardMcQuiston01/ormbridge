name: Publish addons

# Publishes the addon packages in packages/ whose version is not on npm yet, without a release: run it by hand from the
# Actions tab (on main) after an addon's version changed, or when the addon step of the Publish workflow failed. The
# Publish workflow does the same after the core package on every release tag.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-addons:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish the addon packages
        run: |
          # Alphabetical order puts ormbridge-kotlin before ormbridge-spring-data, which depends on it.
          for directory in packages/*/; do
            name="$(node -p "require('./${directory}package.json').name")"
            version="$(node -p "require('./${directory}package.json').version")"
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${name}@${version} is already on npm; skipping."
              continue
            fi
            if [[ "$version" == *-* ]]; then
              echo "Publishing ${name}@${version} with dist-tag 'next'."
              npm publish "./${directory}" --provenance --access public --tag next
            else
              echo "Publishing ${name}@${version} with dist-tag 'latest'."
              npm publish "./${directory}" --provenance --access public
            fi
          done
