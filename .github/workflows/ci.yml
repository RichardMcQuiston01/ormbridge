name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Lets the publish workflow run the same jobs (including the `real-tools` jobs) before releasing.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      # The GORM tests (gorm-emitter, gorm-verify) run `go vet`, `gofmt` and `go build` and skip themselves without Go.
      # The runner image happens to ship Go, but that is not promised, so install it here: they always run in this job.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  # The optional verification tests that load generated code with the real tools. They are skipped in `check`
  # because the tools are not installed there. Separate jobs keep `check` fast, and a package registry outage or a
  # tool release then breaks only the job of that ecosystem, not lint, build and tests.
  #
  # The tools are split into one job per ecosystem so that the installs and the slow test files run in parallel (they
  # took about 15 minutes in one job). Each job installs only what it needs and runs only the test files that use
  # those tools, found by the environment variable or executable the file reads (see test/README.md for the table).
  # The test files that need no tool run in `check`, so they are not repeated here. A test file that needs tools from
  # two ecosystems has to run in a job that has both; when a test starts to use another tool, move it or add the tool.
  # Each job has its own `timeout-minutes`, about twice what it took on a cold cache (databases ~4-5 minutes, node ~3-4,
  # python ~3, the others 1-2), so a hung test step fails fast instead of holding a job for 30 minutes, and a re-run after a hang
  # repeats only the affected ecosystem job. Raise one when its tools or tests grow.
  # `real-tools` at the end waits for all of them and is the one name to require in branch protection.

  # Django, graphene-django, SQLAlchemy 2 and SQLModel, in one virtual environment.
  real-tools-python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/tools/setup-verification-tools.sh
      - run: npm ci
      - name: Install Django, graphene-django, SQLAlchemy 2 and SQLModel
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" python | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the real Python tools
        run: >-
          npx vitest run
          test/django-verify.test.ts
          test/graphene-verify.test.ts
          test/graphene-emitter.test.ts
          test/sqlalchemy-verify.test.ts
          test/sqlalchemy-parser-verify.test.ts
          test/sqlalchemy-emitter.test.ts

  # TypeORM, Drizzle, Sequelize, Ajv, Zod and Prisma.
  real-tools-node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
          key: real-tools-node-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-node-${{ runner.os }}-
      - run: npm ci
      - name: Install TypeORM, Drizzle, Sequelize, Ajv, Zod, better-sqlite3 and Prisma 6 and 7
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" node | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the real Node tools (Prisma 6)
        run: >-
          npx vitest run
          test/typeorm-verify.test.ts
          test/drizzle-verify.test.ts
          test/drizzle-parser-verify.test.ts
          test/sequelize-verify.test.ts
          test/sequelize-parser-verify.test.ts
          test/json-schema-ajv.test.ts
          test/json-schema-verify.test.ts
          test/zod-verify.test.ts
          test/prisma-extras.test.ts
        env:
          PRISMA_BIN: ${{ env.PRISMA6_BIN }}
          PRISMA_MAJOR: '6'
      - name: Prisma 7 validation
        run: npx vitest run test/prisma-extras.test.ts
        env:
          PRISMA_BIN: ${{ env.PRISMA7_BIN }}
          PRISMA_MAJOR: '7'

  # EF Core 8 (reader and writer) with the SQLite and Npgsql providers.
  real-tools-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ${{ env.TOOLS }}/efcore/nuget
          key: real-tools-dotnet-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-dotnet-${{ runner.os }}-
      - run: npm ci
      - name: Install the EF Core 8 packages
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" dotnet | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the real EF Core
        run: >-
          npx vitest run
          test/efcore-emitter.test.ts
          test/efcore-emitter-verify.test.ts
          test/efcore-parser-verify.test.ts

  # Hibernate ORM 6 and 5 (reader and writer), with Maven.
  real-tools-java:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ${{ env.TOOLS }}/jpa/m2
          key: real-tools-java-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', 'test/tools/jpa-verify/pom.xml', 'test/tools/jpa-verify/pom-javax.xml', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-java-${{ runner.os }}-
      - run: npm ci
      - name: Install Hibernate 6 and 5
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" java | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the real Hibernate
        run: >-
          npx vitest run
          test/jpa-emitter-verify.test.ts
          test/jpa-parser-verify.test.ts
          test/jpa-emitter-golden.test.ts
          test/jpa-fixtures.test.ts

  # Doctrine ORM and Illuminate (Laravel), with PHP and Composer.
  real-tools-php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.cache/composer
          key: real-tools-php-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-php-${{ runner.os }}-
      - run: npm ci
      - name: Install Doctrine ORM and Illuminate
        run: |
          mkdir -p "$TOOLS/doctrine" "$TOOLS/laravel"
          (cd "$TOOLS/doctrine" && composer require --no-interaction --no-progress doctrine/orm symfony/cache)
          (cd "$TOOLS/laravel" && composer require --no-interaction --no-progress illuminate/database illuminate/events illuminate/container illuminate/support ramsey/uuid symfony/uid)
          echo "DOCTRINE_DIR=$TOOLS/doctrine" >> "$GITHUB_ENV"
          echo "LARAVEL_DIR=$TOOLS/laravel" >> "$GITHUB_ENV"
      - name: Tests with the real Doctrine and Illuminate
        run: >-
          npx vitest run
          test/doctrine-emitter.test.ts
          test/laravel-emitter.test.ts
          test/laravel-parser.test.ts

  # The SQL DDL, CockroachDB, ClickHouse and Neo4j tests, which execute their output in real servers (SQLite needs
  # none). Only this job starts the servers. The CockroachDB test also runs drizzle-kit, so Drizzle is installed too.
  real-tools-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real servers for the SQL DDL tests, which execute the emitted SQL (SQLite needs none).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s
          --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          # Lets the default user connect over the network without a password.
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Community Edition only. The enterprise-style Neo4j tests need an Enterprise Edition server and a license
      # acceptance that a person has to make, so they are skipped here (see test/README.md to run them yourself).
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ormbridge-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ormbridge-ci-password 'RETURN 1' || exit 1"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
          key: real-tools-databases-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-databases-${{ runner.os }}-
      - run: npm ci
      - name: Install better-sqlite3 for SQLite and Drizzle for drizzle-kit
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" sql drizzle | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Point the SQL DDL tests at the PostgreSQL and MySQL services
        run: |
          # The psql and mysql clients ship with the runner image; install them if that ever changes.
          command -v psql > /dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          command -v mysql > /dev/null || sudo apt-get install -y --no-install-recommends mysql-client
          echo "SQL_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          echo "SQL_MYSQL_URL=mysql://root:root@127.0.0.1:3306" >> "$GITHUB_ENV"
      # A service container cannot be given a command, and CockroachDB needs `start-single-node --insecure`,
      # so it is started here and the step waits until it answers.
      - name: Start CockroachDB for the CockroachDB tests
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest start-single-node --insecure
          for attempt in $(seq 1 60); do
            if docker exec cockroach ./cockroach sql --insecure -e 'SELECT 1' > /dev/null 2>&1; then
              echo "CockroachDB is ready after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs cockroach
              echo "CockroachDB did not start" >&2
              exit 1
            fi
            sleep 2
          done
          command -v psql > /dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          echo "COCKROACH_URL=postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable" >> "$GITHUB_ENV"
      - name: Point the ClickHouse DDL test at the ClickHouse service
        run: echo "CLICKHOUSE_URL=http://127.0.0.1:8123" >> "$GITHUB_ENV"
      - name: Point the Neo4j test at the Neo4j service
        run: |
          echo "NEO4J_URL=http://127.0.0.1:7474" >> "$GITHUB_ENV"
          echo "NEO4J_USER=neo4j" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=ormbridge-ci-password" >> "$GITHUB_ENV"
      - name: Tests against the real databases
        run: >-
          npx vitest run
          test/sql-ddl-verify.test.ts
          test/sql-ddl-parser-verify.test.ts
          test/cockroachdb-verify.test.ts
          test/clickhouse-verify.test.ts
          test/neo4j-verify.test.ts

  # neomodel (Python) against a Neo4j 5 Community service container. A separate job keeps the Python install and the
  # extra container out of `real-tools-databases`, which is the longest job. It runs `neomodel-verify`, which needs
  # both a Python with the pinned neomodel (NEOMODEL_PYTHON) and a server (NEO4J_URL).
  real-tools-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      # Community Edition only: no license has to be accepted.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ormbridge-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ormbridge-ci-password 'RETURN 1' || exit 1"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/tools/setup-verification-tools.sh
      - run: npm ci
      - name: Install neomodel (pinned in the setup script)
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" neomodel | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Point the neomodel test at the Neo4j service
        run: |
          echo "NEO4J_URL=http://127.0.0.1:7474" >> "$GITHUB_ENV"
          echo "NEO4J_BOLT_URL=bolt://127.0.0.1:7687" >> "$GITHUB_ENV"
          echo "NEO4J_USER=neo4j" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=ormbridge-ci-password" >> "$GITHUB_ENV"
      - name: Tests with the real neomodel
        run: npx vitest run test/neomodel-verify.test.ts

  # The single name that stands for all of the real-tool jobs above. Branch protection and `needs: ci` in publish.yml
  # keep working with it, and it fails when any of them failed, was cancelled or did not run.
  real-tools:
    if: ${{ always() }}
    needs:
      - real-tools-python
      - real-tools-node
      - real-tools-dotnet
      - real-tools-java
      - real-tools-php
      - real-tools-databases
      - real-tools-neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every real-tool job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Anything but success counts: failure, cancelled, and skipped (a job that did not run proved nothing).
          if ! echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::At least one real-tool job failed, was cancelled or did not run."
            exit 1
          fi
