name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Lets the publish workflow run the same jobs (including `real-tools`) before releasing.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  # The optional verification tests that load generated code with the real tools (Django,
  # graphene-django, SQLAlchemy and SQLModel, TypeORM, Sequelize, EF Core (reader and writer), Hibernate (reader and writer), Zod, SQL databases (SQLite, PostgreSQL, MySQL, CockroachDB), Doctrine, Illuminate, Prisma, Go). They are skipped in `check`
  # because the tools are not installed there. A separate job keeps `check` fast, and a package
  # registry outage or a tool release then breaks only this job, not lint, build and tests.
  real-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Real servers for the SQL DDL tests, which execute the emitted SQL (SQLite needs none).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s
          --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          # Lets the default user connect over the network without a password.
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Choose the tools directory (outside the repository)
        run: echo "TOOLS=$RUNNER_TEMP/verification-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/tools/setup-verification-tools.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache package downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.cache/composer
            ~/go/pkg/mod
            ${{ env.TOOLS }}/jpa/m2
          key: real-tools-${{ runner.os }}-${{ hashFiles('test/tools/setup-verification-tools.sh', 'test/tools/jpa-verify/pom.xml', 'test/tools/jpa-verify/pom-javax.xml', '.github/workflows/ci.yml') }}
          restore-keys: real-tools-${{ runner.os }}-
      - run: npm ci
      - name: Install Django, graphene-django, SQLAlchemy 2, SQLModel, TypeORM, Drizzle, Sequelize, EF Core 8, Hibernate 6 and 5, Ajv, Zod and better-sqlite3
        run: |
          test/tools/setup-verification-tools.sh "$TOOLS" | grep '^export ' | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Point the SQL DDL tests at the PostgreSQL and MySQL services
        run: |
          # The psql and mysql clients ship with the runner image; install them if that ever changes.
          command -v psql > /dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          command -v mysql > /dev/null || sudo apt-get install -y --no-install-recommends mysql-client
          echo "SQL_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          echo "SQL_MYSQL_URL=mysql://root:root@127.0.0.1:3306" >> "$GITHUB_ENV"
      # A service container cannot be given a command, and CockroachDB needs `start-single-node --insecure`,
      # so it is started here and the step waits until it answers.
      - name: Start CockroachDB for the CockroachDB tests
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest start-single-node --insecure
          for attempt in $(seq 1 60); do
            if docker exec cockroach ./cockroach sql --insecure -e 'SELECT 1' > /dev/null 2>&1; then
              echo "CockroachDB is ready after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs cockroach
              echo "CockroachDB did not start" >&2
              exit 1
            fi
            sleep 2
          done
          command -v psql > /dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          echo "COCKROACH_URL=postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable" >> "$GITHUB_ENV"
      - name: Point the ClickHouse DDL test at the ClickHouse service
        run: echo "CLICKHOUSE_URL=http://127.0.0.1:8123" >> "$GITHUB_ENV"
      - name: Install Doctrine ORM and Illuminate
        run: |
          mkdir -p "$TOOLS/doctrine" "$TOOLS/laravel"
          (cd "$TOOLS/doctrine" && composer require --no-interaction --no-progress doctrine/orm symfony/cache)
          (cd "$TOOLS/laravel" && composer require --no-interaction --no-progress illuminate/database illuminate/events illuminate/container illuminate/support ramsey/uuid symfony/uid)
          echo "DOCTRINE_DIR=$TOOLS/doctrine" >> "$GITHUB_ENV"
          echo "LARAVEL_DIR=$TOOLS/laravel" >> "$GITHUB_ENV"
      - name: Install Prisma 6 and 7
        run: |
          for major in 6 7; do
            mkdir -p "$TOOLS/prisma$major"
            (cd "$TOOLS/prisma$major" && npm init -y > /dev/null && npm install --silent "prisma@$major")
          done
      - name: Tests with the real tools (Prisma 6)
        run: npx vitest run --dir test
        env:
          PRISMA_BIN: ${{ env.TOOLS }}/prisma6/node_modules/.bin/prisma
          PRISMA_MAJOR: '6'
      - name: Prisma 7 validation
        run: npx vitest run test/prisma-extras.test.ts
        env:
          PRISMA_BIN: ${{ env.TOOLS }}/prisma7/node_modules/.bin/prisma
          PRISMA_MAJOR: '7'
